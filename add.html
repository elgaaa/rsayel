<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaPanel | Buat Akun</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page"><main class="login-card register-card"><a class="back" href="index.html">← Kembali</a><div class="brand">Nova<span>Panel</span></div><h2>Buat akun</h2><p class="sub">Daftarkan akun untuk masuk ke dashboard.</p><form id="registerForm"><label class="field"><span>♙</span><input id="newName" placeholder="Nama lengkap" required maxlength="60"></label><label class="field"><span>✉</span><input id="newUser" placeholder="Username" required minlength="3" maxlength="30" autocomplete="username"></label><label class="field"><span>✉</span><input id="newEmail" type="email" placeholder="Email" required autocomplete="email"></label><label class="field"><span>♙</span><input id="newPass" type="password" placeholder="Password (min. 8 karakter)" required minlength="8" autocomplete="new-password"></label><label class="field"><span>♙</span><input id="confirmPass" type="password" placeholder="Ulangi password" required minlength="8" autocomplete="new-password"></label><p class="error" id="registerError"></p><button class="primary full">BUAT AKUN</button></form><p class="signup">Sudah punya akun? <a href="index.html">Login</a></p><small class="demo">Prototipe lokal. Data akun tersimpan di browser ini saja.</small></main><script src="app.js"></script></body></html>
